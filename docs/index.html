<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- video.twimg.com returns 403 when the media element sends a non-X Referer -->
  <meta name="referrer" content="no-referrer">
  <title>马斯克 X 盯盘</title>
  <style>
    :root {
      --bg: #000;
      --text: #e7e9ea;
      --muted: #71767b;
      --border: #2f3336;
      --accent: #1d9bf0;
      --repost: #00ba7c;
      --like: #f91880;
      --unread: #f4212e;
      --hover: rgba(231, 233, 234, 0.1);
    }
    * { box-sizing: border-box; }
    html { color-scheme: dark; }
    html, body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial,
        "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      font-size: 15px;
      line-height: 20px;
      -webkit-text-size-adjust: 100%;
    }
    a { color: var(--accent); text-decoration: none; }
    button, a { -webkit-tap-highlight-color: transparent; }
    .col {
      width: 100%;
      max-width: 600px;
      min-height: 100vh;
      margin: 0 auto;
      border-left: 1px solid var(--border);
      border-right: 1px solid var(--border);
    }
    @media (max-width: 640px) {
      .col { border-left: 0; border-right: 0; }
    }
    header.top {
      position: sticky;
      top: 0;
      z-index: 5;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
    }
    .title-row {
      display: flex;
      align-items: center;
      min-width: 0;
      padding: 6px 12px 1px;
    }
    .sub {
      margin: 0;
      padding: 0;
      min-width: 0;
      color: var(--muted);
      font-size: 11px;
      line-height: 14px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .account-row {
      display: flex;
      align-items: stretch;
      min-width: 0;
      margin-bottom: -1px;
      padding: 0 4px;
    }
    .account-tabs {
      display: flex;
      flex: 1 1 auto;
      align-items: stretch;
      min-width: 0;
      overflow-x: auto;
      overflow-y: hidden;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
    }
    .account-tabs::-webkit-scrollbar { display: none; }
    .account-tab,
    .account-more {
      display: inline-flex;
      align-items: center;
      margin: 0;
      border: 0;
      border-bottom: 2px solid transparent;
      background: transparent;
      color: var(--muted);
      font: inherit;
      cursor: pointer;
    }
    .account-tab {
      flex: 0 1 auto;
      gap: 5px;
      min-width: 0;
      max-width: 100%;
      padding: 3px 8px 2px;
    }
    .account-more {
      position: relative;
      flex: 0 0 auto;
      padding: 3px 10px 2px;
      font-size: 12px;
      font-weight: 700;
      line-height: 15px;
      white-space: nowrap;
    }
    .account-label {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: center;
      min-width: 0;
      max-width: 100%;
    }
    .account-tab .account-name {
      display: block;
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 13px;
      font-weight: 700;
      line-height: 15px;
    }
    .account-tab:hover,
    .account-more:hover { background: var(--hover); }
    .account-tab.is-selected,
    .account-more.is-selected {
      color: var(--text);
      border-bottom-color: var(--accent);
    }
    .account-tab .account-handle,
    .account-menu-item .account-handle {
      color: var(--muted);
      font-weight: 400;
    }
    .account-tab .account-handle {
      display: block;
      max-width: 100%;
      margin-top: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 10px;
      line-height: 12px;
    }
    .account-tab:focus-visible,
    .account-more:focus-visible,
    .account-menu-item:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: -2px;
    }
    .account-avatar-wrap {
      position: relative;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      overflow: visible;
      background: #202327;
      flex: 0 0 auto;
    }
    .account-avatar {
      position: relative;
      z-index: 1;
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      border-radius: 50%;
    }
    .account-avatar.broken { display: none; }
    .account-fallback {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      font-size: 10px;
      font-weight: 700;
      color: var(--text);
    }
    .unread-dot {
      position: absolute;
      top: -2px;
      right: -3px;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--unread);
      box-shadow: 0 0 0 1px #000;
      z-index: 2;
      pointer-events: none;
    }
    .account-more > .unread-dot {
      top: 1px;
      right: 2px;
    }
    .account-overflow {
      position: relative;
      flex: 0 0 auto;
      display: flex;
      align-items: stretch;
    }
    .account-more[hidden],
    .account-menu[hidden] { display: none !important; }
    .account-menu {
      position: absolute;
      top: calc(100% + 4px);
      right: 8px;
      z-index: 8;
      min-width: 220px;
      max-width: min(280px, calc(100vw - 24px));
      margin: 0;
      padding: 4px 0;
      background: #000;
      border: 1px solid var(--border);
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
    }
    .account-menu-item {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
      margin: 0;
      padding: 10px 12px;
      border: 0;
      background: transparent;
      color: var(--text);
      font: inherit;
      font-size: 15px;
      line-height: 20px;
      text-align: left;
      cursor: pointer;
    }
    .account-menu-item:hover { background: var(--hover); }
    .account-menu-item.is-selected { background: rgba(29, 155, 240, 0.12); }
    .account-menu-text {
      display: flex;
      flex-direction: column;
      min-width: 0;
    }
    .account-menu-text .account-handle { font-size: 13px; line-height: 16px; }
    .tweet {
      display: grid;
      grid-template-columns: 40px minmax(0, 1fr);
      column-gap: 12px;
      padding: 12px 16px 8px;
      border-bottom: 1px solid var(--border);
    }
    .tweet:hover { background: rgba(255, 255, 255, 0.03); }
    .context {
      grid-column: 1 / -1;
      display: flex;
      align-items: center;
      margin: 0 0 4px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
      line-height: 16px;
    }
    .context .ctx-icon {
      width: 40px;
      margin-right: 12px;
      display: flex;
      justify-content: flex-end;
      flex: 0 0 auto;
    }
    .context svg { width: 16px; height: 16px; fill: var(--muted); display: block; }
    .context a { color: inherit; }
    .context a:hover { text-decoration: underline; }
    .avatar-col { padding-top: 2px; }
    .avatar-wrap, .q-avatar-wrap {
      position: relative;
      display: block;
      border-radius: 50%;
      background: #16181c;
      overflow: hidden;
      flex: 0 0 auto;
    }
    .avatar-wrap { width: 40px; height: 40px; }
    .q-avatar-wrap { width: 20px; height: 20px; }
    .avatar, .q-avatar {
      position: relative;
      z-index: 1;
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      background: transparent;
    }
    .avatar.broken, .q-avatar.broken { display: none; }
    .avatar-fallback, .q-fallback {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      color: var(--text);
      background: #202327;
    }
    .avatar-fallback { font-size: 16px; }
    .q-fallback { font-size: 11px; }
    .main { min-width: 0; padding-bottom: 4px; }
    .head {
      display: flex;
      align-items: center;
      min-width: 0;
      gap: 4px;
      font-size: 15px;
      line-height: 20px;
    }
    .name {
      color: var(--text);
      font-weight: 700;
      white-space: nowrap;
    }
    .name:hover { text-decoration: underline; }
    .verified { width: 18px; height: 18px; flex: 0 0 auto; display: block; }
    .handle, .dot, .time { color: var(--muted); white-space: nowrap; }
    .handle {
      overflow: hidden;
      text-overflow: ellipsis;
      min-width: 0;
    }
    .time:hover { text-decoration: underline; }
    .replying {
      margin-top: 2px;
      color: var(--muted);
      font-size: 13px;
      line-height: 16px;
    }
    .replying a { color: var(--accent); }
    .replying a:hover { text-decoration: underline; }
    /* pre-wrap only — never convert newlines to <br> (that doubles blank lines) */
    .text, .q-text {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      word-break: break-word;
    }
    .text {
      margin-top: 2px;
      font-size: 15px;
      line-height: 20px;
      color: var(--text);
    }
    .text a, .q-text a { color: var(--accent); }
    .text a:hover, .q-text a:hover { text-decoration: underline; }
    /* Clamp only the text node. Media stays a sibling, so photos and video are never cut off. */
    .text.is-clamped,
    .q-text.is-clamped {
      display: -webkit-box;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 6;
      line-clamp: 6;
      overflow: hidden;
    }
    .text-more {
      display: block;
      width: fit-content;
      margin: 2px 0 0;
      padding: 0;
      border: 0;
      background: none;
      color: var(--accent);
      font: inherit;
      font-size: 15px;
      line-height: 20px;
      cursor: pointer;
    }
    .text-more:hover { text-decoration: underline; }
    .text-more:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
      border-radius: 4px;
    }
    .media {
      display: grid;
      gap: 2px;
      margin-top: 12px;
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
    }
    .media .shot {
      position: relative;
      display: block;
      min-width: 0;
      background: #16181c;
    }
    .media button.shot {
      width: 100%;
      margin: 0;
      padding: 0;
      border: 0;
      color: inherit;
      font: inherit;
      text-align: left;
      cursor: zoom-in;
      appearance: none;
    }
    .media img.photo,
    .media video.photo {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      background: #000;
    }
    .media.n1 { grid-template-columns: 1fr; }
    .media.n1 img.photo,
    .media.n1 video.photo {
      height: auto;
      max-height: 510px;
      object-fit: contain;
      background: #000;
    }
    .media.n2 { grid-template-columns: 1fr 1fr; height: 280px; }
    .media.n3 {
      grid-template-columns: 1.35fr 1fr;
      grid-template-rows: 1fr 1fr;
      height: 288px;
    }
    .media.n3 .shot:first-child { grid-row: 1 / span 2; }
    .media.n4 {
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr 1fr;
      height: 288px;
    }
    .media.n2 .shot,
    .media.n3 .shot,
    .media.n4 .shot { height: 100%; }
    .media .shot.audio {
      display: flex;
      align-items: center;
      height: auto;
      padding: 8px 10px;
      background: #000;
    }
    .media audio { width: 100%; display: block; }
    .play {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 48px;
      height: 48px;
      margin: -24px 0 0 -24px;
      border-radius: 50%;
      background: rgba(29, 155, 240, 0.9);
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }
    .play svg { width: 22px; height: 22px; fill: #fff; margin-left: 2px; }
    .quote {
      display: block;
      margin-top: 12px;
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
      color: inherit;
    }
    .quote:hover { background: rgba(255, 255, 255, 0.03); }
    .q-body { padding: 12px 12px 10px; }
    a.q-head { color: inherit; }
    a.q-head:hover .name { text-decoration: underline; }
    .q-head {
      display: flex;
      align-items: center;
      gap: 4px;
      min-width: 0;
      font-size: 15px;
      line-height: 20px;
    }
    .q-head .q-avatar-wrap { margin-right: 4px; }
    .q-text {
      margin-top: 2px;
      font-size: 15px;
      line-height: 20px;
      color: var(--text);
    }
    .quote .media {
      margin-top: 12px;
      border: 0;
      border-top: 1px solid var(--border);
      border-radius: 0;
    }
    .actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      max-width: 425px;
      margin-top: 4px;
      margin-left: -8px;
      color: var(--muted);
    }
    .act {
      display: inline-flex;
      align-items: center;
      color: inherit;
      font-size: 13px;
      line-height: 16px;
      min-height: 32px;
    }
    .act .ico {
      width: 34px;
      height: 34px;
      border-radius: 999px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .act svg { width: 18px; height: 18px; fill: currentColor; display: block; }
    .act .count:empty { display: none; }
    .act.reply:hover { color: var(--accent); }
    .act.reply:hover .ico { background: rgba(29, 155, 240, 0.1); }
    .act.repost:hover { color: var(--repost); }
    .act.repost:hover .ico { background: rgba(0, 186, 124, 0.1); }
    .act.like:hover { color: var(--like); }
    .act.like:hover .ico { background: rgba(249, 24, 128, 0.1); }
    .act.bookmark:hover { color: var(--accent); }
    .act.bookmark:hover .ico { background: rgba(29, 155, 240, 0.1); }
    .act.views:hover { color: var(--accent); }
    .act.views:hover .ico { background: rgba(29, 155, 240, 0.1); }
    .empty, .note {
      color: var(--muted);
      text-align: center;
      padding: 32px 16px;
    }
    .pager {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 16px 28px;
    }
    .pager button {
      background: transparent;
      color: var(--text);
      border: 1px solid #536471;
      border-radius: 999px;
      padding: 8px 16px;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }
    .pager button:disabled { opacity: 0.35; cursor: default; }
    .pager button:not(:disabled):hover { background: var(--hover); }
    .page-ind { color: var(--muted); font-size: 13px; }
    footer.foot {
      color: var(--muted);
      font-size: 13px;
      text-align: center;
      padding: 4px 16px 32px;
    }
    body.lb-open { overflow: hidden; }
    .lightbox {
      position: fixed;
      inset: 0;
      z-index: 40;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 56px 64px;
      background: rgba(0, 0, 0, 0.92);
      overscroll-behavior: contain;
      touch-action: none;
    }
    .lightbox[hidden] { display: none !important; }
    .lb-img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      cursor: zoom-out;
      user-select: none;
      -webkit-user-drag: none;
    }
    .lb-close,
    .lb-nav {
      position: absolute;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 0;
      border-radius: 999px;
      color: #fff;
      background: rgba(15, 20, 25, 0.75);
      cursor: pointer;
    }
    .lb-close {
      top: 12px;
      right: 12px;
      width: 36px;
      height: 36px;
    }
    .lb-nav {
      top: 50%;
      width: 40px;
      height: 40px;
      margin-top: -20px;
    }
    .lb-close:hover,
    .lb-nav:hover { background: rgba(255, 255, 255, 0.18); }
    .lb-close svg,
    .lb-nav svg { width: 20px; height: 20px; fill: currentColor; display: block; }
    .lb-prev { left: 12px; }
    .lb-next { right: 12px; }
    .lb-nav[hidden],
    .lb-count[hidden] { display: none !important; }
    .lb-count {
      position: absolute;
      left: 50%;
      bottom: 16px;
      transform: translateX(-50%);
      color: #e7e9ea;
      font-size: 15px;
      font-weight: 700;
      line-height: 20px;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.8);
      pointer-events: none;
    }
    @media (max-width: 640px) {
      .lightbox { padding: 52px 12px; }
      .lb-prev { left: 8px; }
      .lb-next { right: 8px; }
    }
  </style>
</head>
<body>
  <div class="col">
    <header class="top">
      <div class="title-row">
        <p class="sub" id="statusText">正在加载时间线…</p>
      </div>
      <div class="account-row" id="accountRow">
        <div class="account-tabs" id="accountTabs" role="tablist" aria-label="账号">
          <button type="button" class="account-tab is-selected" role="tab" aria-selected="true" data-handle="elonmusk">
            <span class="account-avatar-wrap">
              <span class="account-fallback" aria-hidden="true">E</span>
              <img class="account-avatar" src="https://pbs.twimg.com/profile_images/2053244804520427520/m8mdWZCG_200x200.jpg" alt="" referrerpolicy="no-referrer" onerror="this.classList.add('broken')">
            </span>
            <span class="account-label">
              <span class="account-name">Elon Musk</span>
              <span class="account-handle">@elonmusk</span>
            </span>
          </button>
          <button type="button" class="account-tab" role="tab" aria-selected="false" data-handle="rocketlab">
            <span class="account-avatar-wrap">
              <span class="account-fallback" aria-hidden="true">R</span>
              <img class="account-avatar" src="https://pbs.twimg.com/profile_images/1494443717452709900/Y7Lg2mm__200x200.jpg" alt="" referrerpolicy="no-referrer" onerror="this.classList.add('broken')">
            </span>
            <span class="account-label">
              <span class="account-name">Rocket Lab</span>
              <span class="account-handle">@rocketlab</span>
            </span>
          </button>
        </div>
        <div class="account-overflow">
          <button type="button" id="accountMore" class="account-more" hidden aria-haspopup="menu" aria-expanded="false" aria-controls="accountMenu">更多</button>
          <div id="accountMenu" class="account-menu" role="menu" hidden></div>
        </div>
      </div>
    </header>
    <main id="feed"><p class="empty">正在加载…</p></main>
    <nav class="pager" id="pager" hidden>
      <button type="button" id="btnPrev">上一页</button>
      <span class="page-ind" id="pageInd">—</span>
      <button type="button" id="btnNext">下一页</button>
    </nav>
    <footer class="foot">仅供盯盘 · 帖子正文为英文原文</footer>
  </div>
  <div id="lightbox" class="lightbox" hidden role="dialog" aria-modal="true" aria-label="图片预览">
    <button type="button" id="lbClose" class="lb-close" aria-label="关闭">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10.59 12L4.54 5.96l1.42-1.42L12 10.59l6.04-6.05 1.42 1.42L13.41 12l6.05 6.04-1.42 1.42L12 13.41l-6.04 6.05-1.42-1.42L10.59 12z"></path></svg>
    </button>
    <button type="button" id="lbPrev" class="lb-nav lb-prev" aria-label="上一张" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7.414 13l5.043 5.04-1.414 1.42L3.586 12l7.457-7.46 1.414 1.42L7.414 11H21v2H7.414z"></path></svg>
    </button>
    <img id="lbImg" class="lb-img" alt="">
    <button type="button" id="lbNext" class="lb-nav lb-next" aria-label="下一张" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12.957 4.54L20.414 12l-7.457 7.46-1.414-1.42L16.586 13H3v-2h13.586l-5.043-5.04 1.414-1.42z"></path></svg>
    </button>
    <div id="lbCount" class="lb-count" hidden></div>
  </div>
  <script>
(function () {
  var PAGE_SIZE = 20;
  var feedEl = document.getElementById('feed');
  var statusEl = document.getElementById('statusText');
  var pagerEl = document.getElementById('pager');
  var btnPrev = document.getElementById('btnPrev');
  var btnNext = document.getElementById('btnNext');
  var pageInd = document.getElementById('pageInd');
  var page = readPage();
  var totalPages = 1;
  var mode = 'unknown';
  var PINNED_TABS = 4;
  var ACCOUNT_KEY = 'musk-x-feed-account';
  var SEEN_KEY = 'musk-x-feed-seen';
  var DEFAULT_AVATAR = 'https://pbs.twimg.com/profile_images/2053244804520427520/m8mdWZCG_200x200.jpg';
  var accounts = [{ handle: 'elonmusk', name: 'Elon Musk', avatar: DEFAULT_AVATAR }];
  var currentHandle = readStoredHandle() || 'elonmusk';
  var seenMap = readSeenMap();
  var freshness = Object.create(null);
  var loadGen = 0;

  var ICON = {

      var type = String(item.type || '').toLowerCase();
      var url = safeUrl(item.url);
      var thumb = safeUrl(item.thumbnail_url);
      if ((type === 'video' || type === 'gif') && isPlayableVideoUrl(url)) {
        var mime = /\.webm(\?|#|$)/i.test(url) ? 'video/webm' : 'video/mp4';
        var poster = thumb ? ' poster="' + esc(thumb) + '"' : '';
        var loop = type === 'gif' ? ' loop muted' : '';
        return '<div class="shot"><video class="photo" controls playsinline preload="metadata"' +
          loop + poster + ' referrerpolicy="no-referrer" aria-label="' + (type === 'gif' ? '动图' : '视频') + '">' +
          '<source src="' + esc(url) + '" type="' + mime + '"></video></div>';
      }
      if (type === 'audio' && url && (isAudioUrl(url) || type === 'audio')) {
        var audioType = /\.m4a(\?|#|$)/i.test(url) ? 'audio/mp4' : (/\.wav(\?|#|$)/i.test(url) ? 'audio/wav' : 'audio/mpeg');
        return '<div class="shot audio"><audio controls preload="metadata" src="' + esc(url) +
          '" type="' + audioType + '" referrerpolicy="no-referrer" aria-label="音频"></audio></div>';
      }
      /* Still photos (and non-playable posters) open in-page. Video/audio above stay inline. */
      var src = type === 'photo' ? url : (thumb || url);
      if (!src) return '';
      var play = (type === 'video' || type === 'gif' || isVideoThumb(src))
        ? '<span class="play">' + ICON.play + '</span>' : '';
      var label = play ? '查看封面' : '查看图片';
      return '<button type="button" class="shot" data-full="' + esc(src) + '" aria-label="' + label + '">' +
        '<img class="photo" src="' + esc(src) + '" alt="" loading="lazy" referrerpolicy="no-referrer">' +
        play + '</button>';
    }).filter(Boolean);
    if (!shots.length) return '';
    return '<div class="media n' + shots.length + '">' + shots.join('') + '</div>';
  }

  function personHead(person, timeUtc, timeAbs, timeHref) {
    var name = person.name || person.author_name || '';
    var handle = person.author || person.screen_name || '';
    var when = relTime(timeUtc, timeAbs);
    var href = safeUrl(timeHref) || profileLink(handle);
    return '<div class="head">' +
      '<a class="name" href="' + esc(profileLink(handle)) + '" target="_blank" rel="noopener noreferrer">' + esc(name || handle) + '</a>' +
      verifiedMark(person.verified || person.author_verified, person.verified_type || person.author_verified_type) +
      (handle ? '<span class="handle">@' + esc(handle) + '</span>' : '') +
      '<span class="dot">·</span>' +
      '<a class="time" href="' + esc(href) + '" target="_blank" rel="noopener noreferrer" title="' + esc(when.title) + '">' + esc(when.label) + '</a>' +
      '</div>';
  }

  function quoteHtml(q) {
    if (!q || !(q.text || q.author || q.name || (q.images && q.images.length) || (q.media && q.media.length))) return '';
    var href = safeUrl(q.url) || profileLink(q.author);
    var when = relTime(q.created_at_utc, q.created_at_shanghai);
    var timeBit = when.label
      ? '<span class="dot">·</span><span class="time" title="' + esc(when.title) + '">' + esc(when.label) + '</span>'
      : '';
    return '<div class="quote">' +
      '<div class="q-body">' +
      '<a class="q-head" href="' + esc(href) + '" target="_blank" rel="noopener noreferrer">' +
      avatarHtml(q.avatar, q.name, q.author, true) +
      '<span class="name">' + esc(q.name || q.author || '') + '</span>' +
      verifiedMark(q.verified, q.verified_type) +
      (q.author ? '<span class="handle">@' + esc(q.author) + '</span>' : '') +
      timeBit +
      '</a>' +
      (q.text ? '<div class="q-text is-clamped" lang="en">' + linkify(q.text) + '</div>' : '') +
      '</div>' +
      mediaHtml((q.media && q.media.length) ? q.media : (q.images || [])) +
      '</div>';
  }

  function action(cls, label, icon, count, href) {
    return '<a class="act ' + cls + '" href="' + esc(href) + '" target="_blank" rel="noopener noreferrer" aria-label="' + label + '">' +
      '<span class="ico">' + icon + '</span><span class="count">' + esc(fmtNum(count)) + '</span></a>';
  }

  function renderPost(p) {
    var owner = currentAccount();
    var isRt = (p.type_label === '转发' || p.type === '转发') && p.retweet;
    var rt = isRt ? p.retweet : null;
    var person, text, mediaList, timeUtc, timeAbs, timeHref, actionHref;
    if (rt) {
      person = rt;
      text = rt.text || p.text || '';
      mediaList = (rt.media && rt.media.length) ? rt.media : ((rt.images && rt.images.length) ? rt.images : (p.media && p.media.length ? p.media : (p.images || [])));
      timeUtc = rt.created_at_utc || p.created_at_utc;
      timeAbs = rt.created_at_shanghai || p.created_at_shanghai;
      timeHref = rt.url || p.url;
      actionHref = safeUrl(rt.url) || safeUrl(p.url) || '#';
    } else {
      person = {
        name: p.author_name || owner.name || 'Elon Musk',
        author: p.author || owner.handle || 'elonmusk',
        avatar: p.author_avatar,
        verified: p.author_verified !== false,
        verified_type: p.author_verified_type || 'individual'
      };
      text = p.text || '';
      mediaList = (p.media && p.media.length) ? p.media : (p.images || []);
      timeUtc = p.created_at_utc;
      timeAbs = p.created_at_shanghai;
      timeHref = p.url;
      actionHref = safeUrl(p.url) || '#';
    }
    var replyTo = (!rt && p.reply_to) ? p.reply_to : (rt && p.reply_to ? p.reply_to : '');
    if (rt && p.reply_to) replyTo = p.reply_to;
    var context = '';
    if (rt) {
      var muskName = p.author_name || owner.name || 'Elon Musk';
      var muskHref = safeUrl(p.url) || profileLink(owner.handle);
      context = '<div class="context"><span class="ctx-icon">' + ICON.repost + '</span>' +
        '<a href="' + esc(muskHref) + '" target="_blank" rel="noopener noreferrer">' +
        esc(muskName) + ' 转发了</a></div>';
    }
    var replyLine = '';
    if (replyTo) {
      replyLine = '<div class="replying">回复 <a href="' + esc(profileLink(replyTo)) +
        '" target="_blank" rel="noopener noreferrer">@' + esc(replyTo) + '</a></div>';
    }
    var eng = p.engagement || {};
    var actions = '<div class="actions">' +
      action('reply', '回复', ICON.reply, eng.replies, actionHref) +
      action('repost', '转发', ICON.repost, eng.retweets, actionHref) +
      action('like', '喜欢', ICON.like, eng.likes, actionHref) +
      action('bookmark', '书签', ICON.bookmark, eng.bookmarks, actionHref) +
      action('views', '查看', ICON.views, eng.views, actionHref) +
      '</div>';
    return '<article class="tweet" data-id="' + esc(p.id) + '" data-type="' + esc(p.type_label || '') + '">' +
      context +
      '<div class="avatar-col"><a href="' + esc(profileLink(person.author)) + '" target="_blank" rel="noopener noreferrer">' +
      avatarHtml(person.avatar, person.name, person.author, false) + '</a></div>' +
      '<div class="main">' +
      personHead(person, timeUtc, timeAbs, timeHref) +
      replyLine +
      (text ? '<div class="text is-clamped" lang="en">' + linkify(text) + '</div>' : '') +
      mediaHtml(mediaList) +
      quoteHtml(p.quote) +
      actions +
      '</div></article>';
  }

  function updatePager() {
    var show = totalPages > 1;
    pagerEl.hidden = !show;
    pageInd.textContent = '第 ' + page + ' / ' + totalPages + ' 页';
    btnPrev.disabled = page <= 1;
    btnNext.disabled = page >= totalPages;
  }

  function tryApi(n, handle) {
    var url = appBase() + 'api/feed?account=' + encodeURIComponent(handle) +
      '&page=' + n + '&page_size=' + PAGE_SIZE;
    return fetch(url, { cache: 'no-store' }).then(function (r) {
      var ct = r.headers.get('content-type') || '';
      if (!r.ok || ct.indexOf('json') === -1) throw new Error('noapi');
      mode = 'api';
      return r.json();
    });
  }

  function loadPageFile(dir, manifestPromise, n) {
    return manifestPromise.then(function (man) {
      var tp = man.total_pages || 1;
      var p = Math.min(Math.max(1, n), tp);
      return fetch(dir + 'page-' + p + '.json', { cache: 'no-store' }).then(function (r) {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        mode = 'static';
        return r.json();
      });
    });
  }

  function tryStatic(n, handle) {
    var base = appBase();
    var nestedDir = base + 'data/' + encodeURIComponent(handle) + '/';
    return fetch(nestedDir + 'manifest.json', { cache: 'no-store' }).then(function (r) {
      if (r.ok) return loadPageFile(nestedDir, r.json(), n);
      if (handle !== 'elonmusk') throw new Error('HTTP ' + r.status);
      return fetch(base + 'data/manifest.json', { cache: 'no-store' }).then(function (legacy) {
        if (!legacy.ok) throw new Error('HTTP ' + legacy.status);
        return loadPageFile(base + 'data/', legacy.json(), n);
      });
    });
  }

  function applyData(data) {
    var posts = data.posts || [];
    page = data.page || page;
    totalPages = data.total_pages || 1;
    var updated = data.updated_at_shanghai || '—';
    var total = data.total != null ? data.total : posts.length;
    var where = mode === 'api' ? '本地实时' : 'GitHub Pages';
    statusEl.textContent = where + ' · 共 ' + total + ' 条 · 更新于 ' + updated + ' CST';
    var tipId = '';
    if ((data.page || 1) === 1 && posts[0] && posts[0].id) tipId = String(posts[0].id);
    noteFreshness(currentHandle, {
      id: tipId,
      updated_at: data.updated_at_shanghai || ''
    });
    updatePager();
    if (!posts.length) {
      feedEl.innerHTML = '<p class="empty">' +
        (data.error ? ('暂无数据：' + esc(data.error)) : '暂无帖子') + '</p>';
    } else {
      feedEl.innerHTML = posts.map(renderPost).join('');
      syncTextClamps(feedEl);
    }
  }

  var CLAMP_LINES = 6;
  var expandedText = Object.create(null);

  function clampKey(el) {
    var art = el.closest('article.tweet');
    var id = art ? (art.getAttribute('data-id') || '') : '';
    return id + (el.classList.contains('q-text') ? '|quote' : '|body');
  }

  function lineHeightPx(el) {
    var lh = parseFloat(window.getComputedStyle(el).lineHeight);
    return isFinite(lh) && lh > 0 ? lh : 20;
  }

  /* Unclamp only for the measurement. The browser has not painted yet on first render. */
  function fullTextHeight(el) {
    var clamped = el.classList.contains('is-clamped');
    if (clamped) el.classList.remove('is-clamped');
    var h = el.scrollHeight;
    if (clamped) el.classList.add('is-clamped');
    return h;
  }

  function syncOneText(el) {
    if (!el || !el.isConnected) return;
    if (el.getBoundingClientRect().width < 1) return;
    var over = fullTextHeight(el) > lineHeightPx(el) * CLAMP_LINES + 1;
    var btn = el.nextElementSibling;
    var hasBtn = btn && btn.classList && btn.classList.contains('text-more');
    if (!over) {
      el.classList.remove('is-clamped');
      if (hasBtn) btn.remove();
      return;
    }
    if (!hasBtn) {
      btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'text-more';
      el.insertAdjacentElement('afterend', btn);
    }
    var open = !!expandedText[clampKey(el)];
    el.classList.toggle('is-clamped', !open);
    btn.textContent = open ? '收起' : '展开';
    btn.setAttribute('aria-expanded', open ? 'true' : 'false');
  }

  function syncTextClamps(root) {
    var nodes = root.querySelectorAll('.text, .q-text');
    for (var i = 0; i < nodes.length; i++) syncOneText(nodes[i]);
  }

  function toggleClamp(btn) {
    var el = btn.previousElementSibling;
    if (!el || (!el.classList.contains('text') && !el.classList.contains('q-text'))) return;
    var key = clampKey(el);
    var willCollapse = !!expandedText[key];
    if (willCollapse) delete expandedText[key];
    else expandedText[key] = 1;
    syncOneText(el);
    if (willCollapse) {
      var top = el.getBoundingClientRect().top;
      var header = document.querySelector('header.top');
      var offset = header ? Math.round(header.getBoundingClientRect().height) + 8 : 48;
      if (top < offset) window.scrollTo(0, window.scrollY + top - offset);
    }
  }

  function load() {
    var gen = ++loadGen;
    var handle = currentHandle || 'elonmusk';
    var previous = feedEl.getAttribute('data-account') || '';
    var switching = previous !== handle;
    if (switching) {
      feedEl.setAttribute('data-account', handle);
      feedEl.innerHTML = '<p class="empty">正在加载…</p>';
      pagerEl.hidden = true;
      closeLightbox();
    }
    return tryApi(page, handle).catch(function () {
      return tryStatic(page, handle);
    }).then(function (data) {
      if (gen !== loadGen || handle !== currentHandle) return;
      applyData(data);
    }).catch(function (err) {
      if (gen !== loadGen || handle !== currentHandle) return;
      statusEl.textContent = '加载失败';
      if (switching || !feedEl.querySelector('.tweet')) {
        feedEl.innerHTML = '<p class="empty">无法加载动态：' + esc(err && err.message ? err.message : err) + '</p>';
      }
    });
  }

  function go(n, push) {
    page = n;
    var url = new URL(location.href);
    if (n <= 1) url.searchParams.delete('page');
    else url.searchParams.set('page', String(n));
    if (push) history.pushState({ page: n }, '', url);
    else history.replaceState({ page: n }, '', url);
    window.scrollTo(0, 0);
    return load();
  }

  var lb = document.getElementById('lightbox');
  var lbImg = document.getElementById('lbImg');
  var lbPrev = document.getElementById('lbPrev');
  var lbNext = document.getElementById('lbNext');
  var lbCount = document.getElementById('lbCount');
  var gallery = [];
  var galIndex = 0;
  var returnFocus = null;
  var swipeGuard = false;

  function hiRes(url) {
    return String(url || '').replace(/([?&]name=)(?:small|medium|thumb)\b/gi, '$1large');
  }

  function showIndex(i) {
    if (!gallery.length) return;
    galIndex = (i + gallery.length) % gallery.length;
    var raw = gallery[galIndex];
    lbImg.alt = '图片 ' + (galIndex + 1);
    lbImg.setAttribute('data-raw', raw);
    lbImg.src = hiRes(raw);
    var multi = gallery.length > 1;
    lbPrev.hidden = !multi;
    lbNext.hidden = !multi;
    lbCount.hidden = !multi;
    lbCount.textContent = multi ? ((galIndex + 1) + ' / ' + gallery.length) : '';
  }

  lbImg.addEventListener('error', function () {
    var raw = lbImg.getAttribute('data-raw') || '';
    if (raw && lbImg.getAttribute('src') !== raw) lbImg.src = raw;
  });

  function openLightbox(urls, index, opener) {
    gallery = (urls || []).filter(Boolean);
    if (!gallery.length) return;
    returnFocus = opener || null;
    lb.hidden = false;
    document.body.classList.add('lb-open');
    showIndex(index || 0);
    document.getElementById('lbClose').focus();
  }

  function closeLightbox() {
    if (lb.hidden) return;
    lb.hidden = true;
    document.body.classList.remove('lb-open');
    lbImg.removeAttribute('src');
    gallery = [];
    var back = returnFocus;
    returnFocus = null;
    if (back && back.isConnected) back.focus();
  }

  function step(delta) {
    if (gallery.length < 2) return;
    showIndex(galIndex + delta);
  }

  feedEl.addEventListener('click', function (e) {
    var more = e.target.closest('button.text-more');
    if (more && feedEl.contains(more)) {
      e.preventDefault();
      toggleClamp(more);
      return;
    }
    var btn = e.target.closest('button.shot[data-full]');
    if (!btn || !feedEl.contains(btn)) return;
    var media = btn.closest('.media');
    var nodes = media
      ? Array.prototype.slice.call(media.querySelectorAll('button.shot[data-full]'))
      : [btn];
    var urls = nodes.map(function (n) { return n.getAttribute('data-full') || ''; });
    openLightbox(urls, Math.max(0, nodes.indexOf(btn)), btn);
  });

  lb.addEventListener('click', function (e) {
    if (swipeGuard) {
      swipeGuard = false;
      return;
    }
    if (e.target.closest('#lbPrev')) {
      step(-1);
      return;
    }
    if (e.target.closest('#lbNext')) {
      step(1);
      return;
    }
    closeLightbox();
  });

  document.addEventListener('keydown', function (e) {
    if (!lb.hidden) {
      if (e.key === 'Escape') {
        e.preventDefault();
        closeLightbox();
      } else if (e.key === 'ArrowLeft') {
        e.preventDefault();
        step(-1);
      } else if (e.key === 'ArrowRight') {
        e.preventDefault();
        step(1);
      }
      return;
    }
    if (e.key === 'Escape') {
      var menu = document.getElementById('accountMenu');
      if (menu && !menu.hidden) {
        e.preventDefault();
        closeAccountMenu();
        document.getElementById('accountMore').focus();
      }
    }
  });

  var touchX = null;
  var touchY = null;
  lb.addEventListener('touchstart', function (e) {
    if (e.touches.length !== 1) return;
    touchX = e.touches[0].clientX;
    touchY = e.touches[0].clientY;
  }, { passive: true });
  lb.addEventListener('touchend', function (e) {
    if (touchX == null || !e.changedTouches.length) return;
    var dx = e.changedTouches[0].clientX - touchX;
    var dy = e.changedTouches[0].clientY - touchY;
    touchX = null;
    if (gallery.length > 1 && Math.abs(dx) >= 48 && Math.abs(dx) > Math.abs(dy) * 1.2) {
      swipeGuard = true;
      step(dx < 0 ? 1 : -1);
    }
  });

  btnPrev.addEventListener('click', function () {
    if (page > 1) go(page - 1, true);
  });
  btnNext.addEventListener('click', function () {
    if (page < totalPages) go(page + 1, true);
  });
  window.addEventListener('popstate', function () {
    page = readPage();
    load();
  });

  var clampResizeTimer;
  window.addEventListener('resize', function () {
    clearTimeout(clampResizeTimer);
    clampResizeTimer = setTimeout(function () { syncTextClamps(feedEl); }, 150);
  });

  document.getElementById('accountRow').addEventListener('click', onAccountRowClick);
  document.addEventListener('click', function (e) {
    var menu = document.getElementById('accountMenu');
    var more = document.getElementById('accountMore');
    if (!menu || menu.hidden) return;
    if (more.contains(e.target) || menu.contains(e.target)) return;
    closeAccountMenu();
  });

  boot();
  setInterval(refreshTick, 30000);
  document.addEventListener('visibilitychange', function () {
    if (!document.hidden) refreshTick();
  });
  window.addEventListener('storage', function (e) {
    if (e.key !== SEEN_KEY) return;
    seenMap = readSeenMap();
    applyUnreadDots();
  });
})();
  </script>
</body>
</html>
