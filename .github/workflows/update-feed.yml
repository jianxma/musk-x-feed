name: Update X Feed

on:
  schedule:
    # Every 5 minutes (Actions cron is best-effort and may drift a bit under load)
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      # The job commits the DB + paginated JSON. Ignore those paths so the
      # push does not start another run.
      - "docs/**"
      - "musk_feed.db"
      - "README.md"
      - ".gitignore"

permissions:
  contents: write

concurrency:
  group: update-feed
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Incremental sync and static export
        id: build
        run: |
          # Scrapes every watched account and writes docs/data/<handle>/.
          # A Rocket Lab (or other) fetch miss must not skip the commit: the
          # export already ran. FETCH_INCOMPLETE is failed after the commit.
          set +e
          python sync.py --export > /tmp/build.log
          status=$?
          cat /tmp/build.log
          if grep -q 'CONTENT_CHANGED=yes' /tmp/build.log; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
          if grep -q 'FETCH_INCOMPLETE=yes' /tmp/build.log; then
            echo "fetch_incomplete=true" >> "$GITHUB_OUTPUT"
          else
            echo "fetch_incomplete=false" >> "$GITHUB_OUTPUT"
          fi
          if [[ "$status" -ne 0 ]]; then
            if grep -q 'FETCH_INCOMPLETE=yes' /tmp/build.log && grep -q 'CONTENT_CHANGED=' /tmp/build.log; then
              exit 0
            fi
            exit "$status"
          fi

      - name: Commit data if content changed
        if: always() && steps.build.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- musk_feed.db docs/data
          if git diff --cached --quiet; then
            echo "No staged changes after export; skip commit"
            exit 0
          fi
          git commit -m "chore: update X feed [skip ci]"
          git push

      - name: Report incomplete fetch
        if: always() && steps.build.outputs.fetch_incomplete == 'true'
        run: |
          echo "A watched-account fetch failed after export. Changed pages were still committed."
          exit 1
