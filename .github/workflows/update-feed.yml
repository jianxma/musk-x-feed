name: Update Musk X Feed

on:
  schedule:
    # Every 10 minutes (Actions cron is best-effort; often ~5–15 min)
    - cron: "*/10 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      # The job commits the DB + paginated JSON. Ignore those paths so the
      # push does not start another run.
      - "docs/**"
      - "musk_feed.db"
      - "README.md"
      - ".gitignore"

permissions:
  contents: write

concurrency:
  group: update-feed
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Incremental sync and static export
        id: build
        run: |
          python sync.py --export | tee /tmp/build.log
          if grep -q 'CONTENT_CHANGED=yes' /tmp/build.log; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit data if content changed
        if: steps.build.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- musk_feed.db docs/data
          if git diff --cached --quiet; then
            echo "No staged changes after export; skip commit"
            exit 0
          fi
          git commit -m "chore: update Elon Musk X feed [skip ci]"
          git push
